<!-- Leave Modal -->
<div class="modal-overlay" id="leave-ov" onclick="if(event.target===this)closeLeaveModal()" style="display:none">
  <div class="modal leave-modal">
    <div class="modal-head">
      <h3 class="modal-title">📅 新增請假</h3>
      <button class="modal-close" onclick="closeLeaveModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="field">
      <label>開始日期</label>
      <input type="date" id="leave-date-input" onchange="syncLeaveEndMin()">
    </div>
    <div class="field">
      <label>結束日期 <span>（選填，單天可不填）</span></label>
      <input type="date" id="leave-end-input">
    </div>
    <div class="field">
      <label>備註 <span>（選填）</span></label>
      <input type="text" id="leave-note-input" placeholder="例：看診、家庭因素…" maxlength="30">
    </div>
    <button class="vote-confirm-btn" onclick="submitLeave()" style="margin-top:4px">確認請假</button>
  </div>
</div>
