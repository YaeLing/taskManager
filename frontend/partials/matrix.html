<!-- CENTER: Quadrant Matrix + Completed -->
<div class="right-area">
  <div class="matrix grid-mode">
    <!-- Q1 -->
    <div class="quadrant" id="q1"
         ondragover="onDragOver(event,1)" ondrop="onDrop(event,1)" ondragleave="event.currentTarget.classList.remove('drag-over')">
      <div class="q-header">
        <div class="q-dot" style="background:var(--q1);--c:var(--q1)"></div>
        <span class="q-title" style="color:var(--q1)">緊急 ＆ 重要</span>
        <span class="q-badge" id="b1" style="background:var(--q1bg);color:var(--q1);border:1px solid var(--q1gl)">0</span>
      </div>
      <div class="q-tasks" id="t1" onclick="qAreaClick(event,1)"></div>
    </div>
    <!-- Q2 -->
    <div class="quadrant" id="q2"
         ondragover="onDragOver(event,2)" ondrop="onDrop(event,2)" ondragleave="event.currentTarget.classList.remove('drag-over')">
      <div class="q-header">
        <div class="q-dot" style="background:var(--q2)"></div>
        <span class="q-title" style="color:var(--q2)">緊急 ＆ 不重要</span>
        <span class="q-badge" id="b2" style="background:var(--q2bg);color:var(--q2);border:1px solid var(--q2gl)">0</span>
      </div>
      <div class="q-tasks" id="t2" onclick="qAreaClick(event,2)"></div>
    </div>
    <!-- Q3 -->
    <div class="quadrant" id="q3"
         ondragover="onDragOver(event,3)" ondrop="onDrop(event,3)" ondragleave="event.currentTarget.classList.remove('drag-over')">
      <div class="q-header">
        <div class="q-dot" style="background:var(--q3)"></div>
        <span class="q-title" style="color:var(--q3)">不緊急 ＆ 重要</span>
        <span class="q-badge" id="b3" style="background:var(--q3bg);color:var(--q3);border:1px solid var(--q3gl)">0</span>
      </div>
      <div class="q-tasks" id="t3" onclick="qAreaClick(event,3)"></div>
    </div>
    <!-- Q4 -->
    <div class="quadrant" id="q4"
         ondragover="onDragOver(event,4)" ondrop="onDrop(event,4)" ondragleave="event.currentTarget.classList.remove('drag-over')">
      <div class="q-header">
        <div class="q-dot" style="background:var(--q4)"></div>
        <span class="q-title" style="color:var(--q4)">不緊急 ＆ 不重要</span>
        <span class="q-badge" id="b4" style="background:var(--q4bg);color:var(--q4);border:1px solid var(--q4gl)">0</span>
      </div>
      <div class="q-tasks" id="t4" onclick="qAreaClick(event,4)"></div>
    </div>
    <!-- Axis -->
    <div class="ax ax-h"></div>
    <div class="ax ax-v"></div>
    <span class="ax-lbl al-top">重要 ↑</span>
    <span class="ax-lbl al-bottom">↓ 不重要</span>
    <span class="ax-lbl al-left">← 緊急</span>
    <span class="ax-lbl al-right">不緊急 →</span>
  </div>

  <!-- COMPLETED -->
  <div class="col-resizer col-resizer--done" id="resizer-done" style="display:none"></div>
  <div class="completed-section" id="done-section" style="display:none">
    <div class="done-header" id="done-header">
      <div class="done-dot"></div>
      <span class="done-title">已完成</span>
      <span class="done-badge" id="done-badge">0</span>
    </div>
    <div class="done-tasks" id="done-list"
         ondragover="onDoneDragOver(event)" ondrop="onDoneDrop(event)" ondragleave="document.getElementById('done-list').classList.remove('drag-over')">
    </div>
  </div>
</div><!-- /right-area -->
