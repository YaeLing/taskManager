<!-- Vote Modal -->
<div class="modal-overlay" id="vote-ov" onclick="if(event.target===this)closeVoteModal()" style="display:none">
  <div class="modal vote-modal">
    <div class="modal-head">
      <h3 class="modal-title">🚀 本週投票</h3>
      <button class="modal-close" onclick="closeVoteModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="vote-desc">選擇本週一件讓你印象深刻的完成任務，給完成它的人 🚀 +1</p>
    <div class="vote-task-list" id="vote-task-list"></div>
  </div>
</div>
