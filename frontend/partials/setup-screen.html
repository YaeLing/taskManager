<!-- SETUP SCREEN -->
<div id="setup-screen" class="setup-screen" style="display:none">
  <div class="setup-box">
    <div class="setup-av-preview" id="setup-av-preview"></div>
    <div class="setup-title">歡迎使用任務排程管理</div>
    <div class="setup-sub">請設定您的使用者資料，下次進入將自動載入</div>
    <div class="setup-section-lbl">選擇大頭貼</div>
    <div class="av-grid" id="av-grid"></div>
    <div class="setup-section-lbl">或上傳自訂頭像</div>
    <div class="avatar-upload-area">
      <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onchange="handleAvatarUpload(event)">
      <button class="btn-upload-avatar" onclick="document.getElementById('avatar-file').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span id="upload-btn-text">選擇圖片上傳</span>
      </button>
      <div class="upload-hint">支援 PNG、JPG、GIF、WebP（建議 200x200 以上）</div>
    </div>
    <div class="setup-section-lbl">您的姓名</div>
    <input type="text" class="setup-name-inp" id="setup-name" placeholder="輸入您的姓名…" maxlength="20" autocomplete="off" oninput="onSetupNameInput(this.value)">
    <div id="setup-name-hint" style="font-size:.72rem;color:var(--acc);margin:-14px 0 10px;min-height:18px;text-align:center"></div>
    <button class="btn-setup" id="btn-setup-save" onclick="saveProfile()">開始使用</button>
  </div>
</div>
