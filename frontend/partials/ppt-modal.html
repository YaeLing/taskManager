<!-- PPT Settings Modal -->
<div class="weekly-overlay" id="ppt-overlay" onclick="if(event.target===this)closePPTModal()">
  <div class="ppt-modal">
    <div class="ppt-head">
      <h3>生成週報</h3>
      <span class="ppt-week-badge" id="ppt-week-badge"></span>
      <button class="wr-img-del" onclick="closePPTModal()" title="關閉">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="field">
      <label>簡報主題</label>
      <input type="text" id="ppt-title" placeholder="簡報主題" oninput="savePPTConfig()">
    </div>
    <div class="field">
      <label>報告人員</label>
      <input type="text" id="ppt-presenters" placeholder="報告人員" oninput="savePPTConfig()">
    </div>
    <div class="field">
      <label>版型模板 <span>（上傳 .pptx，套用其背景與 Master）</span></label>
      <div class="ppt-template-zone" id="ppt-template-zone" onclick="document.getElementById('ppt-tmpl-input').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="ppt-template-status" id="ppt-template-status">點選選擇 .pptx 檔案</span>
        <input type="file" id="ppt-tmpl-input" accept=".pptx" style="display:none" onchange="uploadPPTTemplate(this.files[0]);this.value=''">
      </div>
    </div>
    <div class="ppt-divider"></div>
    <div class="ppt-record-count" id="ppt-record-count">本週已記錄 0 個任務</div>
    <div class="ppt-btns">
      <button class="ppt-clear" onclick="clearWeeklyHistory()">清除歷史紀錄</button>
      <button class="ppt-generate" id="ppt-gen-btn" onclick="generatePPT()">生成 PPT</button>
    </div>
  </div>
</div>
