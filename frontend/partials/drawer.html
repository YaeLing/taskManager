<!-- Comment Drawer -->
<div class="drawer-overlay" id="dov" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer">
    <div class="drawer-head">
      <div class="drawer-top">
        <div class="drawer-qdot" id="dqdot"></div>
        <span class="drawer-qname" id="dqname"></span>
        <button class="drawer-edit" onclick="openModal(openTaskId)" title="編輯">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>編輯
        </button>
        <button class="drawer-edit" onclick="copyTaskUrl()" title="複製連結" id="drawer-copy-url-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>複製連結
        </button>
        <button class="drawer-close" onclick="closeDrawer()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="drawer-title" id="dtitle" contenteditable="plaintext-only" data-placeholder="任務名稱"
           onblur="saveDrawerField('text',this.textContent.trim())"
           onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"></div>
      <div class="drawer-desc" id="ddesc" contenteditable="plaintext-only" data-placeholder="點此新增說明…"
           onblur="saveDrawerField('desc',this.textContent.trim())"></div>
      <div class="drawer-meta" id="dmeta"></div>
    </div>
    <div class="comments-head">
      <span class="comments-head-lbl">留言討論</span>
      <span class="comments-count-pill" id="clist-count">0 則</span>
    </div>
    <div class="comments-list" id="clist"></div>
    <div class="comment-input-wrap">
      <textarea id="cinp" placeholder="輸入留言… (Enter 送出)" rows="2"></textarea>
      <button class="send-btn" onclick="addComment()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>
