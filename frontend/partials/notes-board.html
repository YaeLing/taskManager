<!-- NOTES BOARD -->
<div class="notes-area">
  <div class="notes-head">
    <div class="notes-head-left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <h2>我的便條紙</h2>
      <span class="notes-count" id="notes-count">0 / 30</span>
    </div>
    <button class="notes-add-btn" onclick="openNoteTypePicker()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      新增
    </button>
  </div>
  <div class="notes-grid" id="notes-grid">
    <div class="notes-empty">點擊「＋ 新增」建立第一張便條紙</div>
  </div>
</div>

<!-- COMPLETED TASKS (toggled by header 已完成 button) -->
<div class="col-resizer col-resizer--done" id="resizer-done" style="display:none"></div>
<div class="completed-section" id="done-section" style="display:none">
  <div class="done-header" id="done-header">
    <div class="done-dot"></div>
    <span class="done-title">已完成</span>
    <span class="done-badge" id="done-badge">0</span>
  </div>
  <div class="done-tasks" id="done-list"
       ondragover="onDoneDragOver(event)" ondrop="onDoneDrop(event)"
       ondragleave="document.getElementById('done-list').classList.remove('drag-over')">
  </div>
</div>
